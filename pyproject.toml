[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "cpu-rag-pipeline"
version = "1.0.0"
description = "Local, CPU-only retrieval-augmented generation pipeline: chunking, embeddings, vector store, hybrid retrieval and retrieval evaluation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Herman Hoffman" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
cpurag = "cpurag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cpurag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["cpurag"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/cpurag"]
